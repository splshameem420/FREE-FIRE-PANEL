name: Auto Build EXE with Auto-Increment Version

on:
  push:
    paths:
      - '**.py' # যেকোনো পাইথন ফাইল আপডেট হলে এটি রান হবে

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Git Push-এর পারমিশন

    steps:
    - name: Checkout Repository
      uses: uses/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests keyauth pyfiglet rarfile qrcode discord-interactions Pillow

    - name: Build EXE with Auto Version
      shell: powershell
      run: |
        $majorVersion = "2"
        $buildNum = ${{ github.run_number }} - 1
        $ver = "$majorVersion.$buildNum"
        $exeName = "bd-hex-cheat$ver"

        @{ version = $ver } | ConvertTo-Json | Set-Content -Path "version.json"

        # PyInstaller দিয়ে সকল প্যাকেজসহ EXE বিল্ড
        pyinstaller --noconfirm --onefile --console `
          --collect-all pyfiglet `
          --hidden-import=rarfile `
          --hidden-import=qrcode `
          --hidden-import=discord_interactions `
          --hidden-import=PIL `
          --name $exeName Loader.py

        if (!(Test-Path -Path "Updates")) { New-Item -ItemType Directory -Path "Updates" }
        Copy-Item -Path "dist/$exeName.exe" -Destination "Updates/$exeName.exe" -Force

    - name: Commit and Push Updated EXE and version.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: powershell
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Updates/ version.json
        git commit -m "Auto-built versioned EXE (v$ver) from push"
        git push origin main
